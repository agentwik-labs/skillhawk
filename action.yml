name: Skillyard skill check
description: Format check and security scan for Agent Skills in a pull request, with a summary on the run page.
branding:
  icon: check-circle
  color: green
inputs:
  paths:
    description: Space-separated folders that hold skills
    default: skills .claude/skills
  compare:
    description: Base ref (e.g. origin/main) to compare changed skills against; adds a review/test table to the summary
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Check skills
      shell: bash
      env:
        SKILL_PATHS: ${{ inputs.paths }}
        COMPARE_REF: ${{ inputs.compare }}
      run: node "$GITHUB_ACTION_PATH/bin/skillyard.js" ci $SKILL_PATHS ${COMPARE_REF:+--compare "$COMPARE_REF"}
