name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/skillyard.js seed --data .demo-data --community
      - run: node tools/build-library.mjs --data .demo-data
      # The canonical URL used by every pre-rendered page and the sitemap. Defaults to the GitHub Pages URL; once a
      # custom domain is live, uncomment this (or pass --site-url) and no other file changes.
      - run: node bin/skillyard.js export site --data .demo-data --out _site
        # env:
        #   SITE_URL: https://example.com
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
