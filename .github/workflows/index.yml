# Weekly public index: grade and security-scan every skill in the tracked public repositories (sources/community.json)
# and commit the dated snapshot to data/index/. No model calls; git history records when each result was made.
name: index
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot
        run: node tools/index-snapshot.mjs --out data/index
      - name: Commit
        run: |
          git config user.name "skillhawk-index[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/index   # data/ is gitignored for local registry data; this folder is published on purpose
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "index: snapshot $(date -u +%F)"
          git pull --rebase --quiet origin main
          git push
